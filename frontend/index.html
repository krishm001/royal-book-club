<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Royal Book Club</title>

    <!-- Synchronous NFC Deep Link Interceptor & History Sanitizer -->
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('u')) {
          let u = params.get('u');
          let c = params.get('c') || '';
          if (u && u.indexOf('x') !== -1) {
            const parts = u.split('x');
            u = parts[0];
            c = parts[1];
          }
          if (u) {
            u = u.toLowerCase().replace(/:/g, '');
          }
          sessionStorage.setItem('pending_nfc_u', u);
          if (c) {
            sessionStorage.setItem('pending_nfc_c', c);
          }
          if (params.has('c')) {
            params.delete('c');
          }
          params.delete('u');
          let newSearch = params.toString();
          if (newSearch) {
            newSearch = '?' + newSearch;
          }
          const cleanUrl = window.location.origin + window.location.pathname + newSearch + window.location.hash;
          window.history.replaceState(null, '', cleanUrl);
        }
      })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
