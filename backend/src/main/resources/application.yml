server:
  port: ${PORT:8080}

spring:
  application:
    name: royal-book-club-api
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Firebase configuration
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:royal-book-club}

# Open Library API
openlibrary:
  base-url: https://openlibrary.org

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://royalbookclub.com,https://krishm001.github.io}
  jwt:
    # Firebase Auth handles JWT — this is for any custom token needs
    issuer: https://securetoken.google.com/royal-book-club

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    com.royalbookclub: DEBUG
    com.google.cloud.firestore: WARN
    org.springframework.security: DEBUG

# GCP Configuration
gcp:
  moderation:
    use-real: ${USE_REAL_MODERATION:false}

